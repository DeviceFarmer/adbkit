version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  groups:
    dev-dependencies:
      dependency-type: development
  ignore:
  # typescript-eslint supports TypeScript < 6.1 only.
  - dependency-name: typescript
    update-types: ["version-update:semver-major"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
